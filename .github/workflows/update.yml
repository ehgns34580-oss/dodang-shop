name: 새 영상 자동 업데이트 & 배포

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다: 새 영상 확인 (RSS)
    - cron: "15 */3 * * *"   # 3시간마다: 무신사 큐레이터샵 큐레이션 다시 읽기
    - cron: "45 18 * * *"    # 매일 새벽 3:45(KST): 채널 전체 영상 목록 다시 스캔
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/overrides.json", "config.json", "scripts/**", "assets/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 유튜브 새 영상 확인
        id: fetch
        run: python scripts/fetch.py

      - name: 브라우저 도구 준비 (큐레이터샵/채널 스캔용)
        id: need
        if: steps.fetch.outputs.new != '0' || github.event_name != 'schedule' || github.event.schedule != '*/30 * * * *'
        run: |
          pip install -q playwright==1.60.0
          python -m playwright install --with-deps chromium
          echo "browser=true" >> "$GITHUB_OUTPUT"

      - name: 채널 전체 영상 스캔 (매일/수동)
        if: steps.need.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 18 * * *')
        run: python scripts/channel.py && python scripts/fetch.py
        continue-on-error: true

      - name: 무신사 큐레이터샵 큐레이션 읽기
        if: steps.need.outputs.browser == 'true'
        run: python scripts/curator.py
        continue-on-error: true

      - name: 데이터 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "dodang-bot"
            git config user.email "dodang-bot@users.noreply.github.com"
            git add data/
            git commit -m "data: 영상/큐레이션 업데이트 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: 사이트 빌드
        if: env.changed == 'true' || github.event_name != 'schedule'
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        if: env.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site

      - name: GitHub Pages 배포
        id: deploy
        if: env.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
